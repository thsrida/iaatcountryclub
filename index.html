<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #fff;
      color: #202124;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    #error {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    
    .box {
      width: 100%;
      max-width: 600px;
    }
    
    h1 {
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 20px;
    }
    
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #5f6368;
    }
    
    .code {
      margin-top: 25px;
      font-size: 14px;
      color: #5f6368;
    }
    
    button {
      margin-top: 30px;
      padding: 10px 20px;
      border: 1px solid #dadce0;
      background: #fff;
      border-radius: 4px;
      color: #1a73e8;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  
  <div id="error">
    
    <div class="box">
      
      <h1>This site can’t be reached</h1>
      
      <p>
        The website is currently unavailable.
      </p>
      
      <div class="code">
        ERR_CONNECTION_CLOSED
      </div>
      
    </div>
    
  </div>
  
  <script>
    /* Subscription expiration date */
    const expirationDate = new Date("2026-12-31T23:59:59");
    
    /*
       This page represents the state shown
       after the subscription has expired.
    */
    
    if (new Date() < expirationDate) {
      // Your normal website should be loaded here
    }
  </script>
  
</body>

</html>
