<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iaat Country Club | صيانة مؤقتة</title>
    
    <!-- Google Fonts (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'Segoe UI', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .system-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Container Card -->
    <div class="system-card rounded-2xl p-6 sm:p-8 max-w-lg w-full text-center space-y-6 relative z-10">
        
        <!-- Logo Header -->
        <div class="flex justify-center mx-auto">
            <div class="w-20 h-20 bg-slate-50 rounded-2xl p-2 border border-slate-200 flex items-center justify-center shadow-sm">
                <img src="https://j.top4top.io/p_394764vo31.png" alt="Iaat Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/80x80/0ea5e9/ffffff?text=Iaat'">
            </div>
        </div>

        <!-- Title & Subtitle -->
        <div class="space-y-2">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">
                <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> صيانة دورية مؤقتة
            </span>
            <h1 class="text-2xl font-black text-slate-900">Iaat Country Club</h1>
            <p class="text-xs text-slate-500 font-bold tracking-wide">نظام إدارة المسبح الشتوي</p>
        </div>

        <!-- Message Box -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
            <p class="text-sm font-semibold text-slate-700 leading-relaxed text-center">
                عذراً لإنقطاع الخدمة المؤقت. نقوم حالياً بإجراء تحديثات وتحسينات على النظام لضمان أفضل أداء.
            </p>
            <div class="p-3 bg-brand-50 rounded-lg border border-brand-100 text-center">
                <p class="text-xs font-bold text-brand-700 flex items-center justify-center gap-1.5">
                    <i class="fa-regular fa-clock text-brand-600"></i> سنعود للعمل فور الانتهاء من التحديثات مباشرة.
                </p>
            </div>
        </div>

        <p class="text-xs text-slate-500 font-medium">
            نشكر تفهمكم وحسن تعاونكم.
        </p>

        <!-- Footer -->
        <div class="pt-4 border-t border-slate-100 flex flex-col items-center justify-center gap-1 text-[11px] text-slate-400">
            <div class="flex items-center gap-1.5 text-slate-600 font-bold">
                <span>تطوير وإشراف:</span>
                <span class="text-slate-800 font-black bg-slate-100 px-2.5 py-0.5 rounded-md border border-slate-200">رضا الجمعة</span>
            </div>
            <span>Iaat Country Club &copy; 2026</span>
        </div>

    </div>

</body>
</html>
